name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['run3-local-candidate-*', 'run3-1-replit-founding-household-*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run verify:secrets
      - run: npm run verify:runtime-deps
      - run: node scripts/verify-portability.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run verify:production-ui
      - run: npm run verify:next-resource-auth
      - run: npm run build -w @boomerbuddy/worker
      - run: npm run verify:run3-1-deps
        env:
          BB_DEPENDENCY_EVIDENCE_DIR: ${{ runner.temp }}/run3-1-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run3-1-dependency-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/run3-1-dependencies
          if-no-files-found: error

  edge:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: boomerbuddy
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: boomerbuddy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boomerbuddy -d boomerbuddy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://boomerbuddy:local-ci-password@127.0.0.1:5432/boomerbuddy_ci
      BB_ALLOW_POSTGRES_VERIFICATION: 'true'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/verify-postgres.ts

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: boomerbuddy/run3-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
